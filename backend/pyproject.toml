[project]
name = "growsphere-backend"
version = "0.1.0"
description = "GrowSphere — Evidence-based career growth platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.3.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]
